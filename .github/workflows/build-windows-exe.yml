name: Build Windows One-Click EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Package Single-File NeonStarServer.exe
        run: |
          pyinstaller --noconsole --onefile --name NeonStarServer --add-data "frontend;frontend" app_launcher.py

      - name: Upload NeonStarServer.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonStarServer-Windows-EXE
          path: dist/NeonStarServer.exe
